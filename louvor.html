<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5efe3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Escala CBO">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Escala do Louvor CBO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="board-header">
    <div class="board-header__brand">
      <img src="logo-igreja.png" alt="Comunidade Batista Oceânica" class="church-logo">
      <div class="board-header__title">
        <span class="board-header__eyebrow">Ministério de Louvor</span>
        <h1>Quadro de Escala</h1>
      </div>
    </div>
    <div class="board-header__you">
      <label for="meuNome">Seu nome</label>
      <input type="text" id="meuNome" placeholder="Como você se chama?" autocomplete="off">
      <span class="save-hint" id="saveHint">salvo neste navegador</span>
    </div>
  </header>

  <div class="install-app-wrap">
    <button type="button" id="installAppBtn" class="install-app-btn">⬇️ Baixe aqui o app</button>
    <p id="installAppHelp" class="install-app-help" hidden></p>
  </div>

  <div class="month-nav">
    <button id="prevMonth" class="month-nav__btn" aria-label="Mês anterior">&#8592;</button>
    <div class="month-nav__label">
      <span id="monthLabel">Agosto</span> <span id="yearLabel" class="month-nav__year">2026</span>
    </div>
    <button id="nextMonth" class="month-nav__btn" aria-label="Próximo mês">&#8594;</button>
    <div class="month-nav__status" id="connStatus">conectando…</div>
  </div>

  <main id="calendarGrid" class="calendar-grid" aria-live="polite"></main>

  <footer class="app-footer">
    Feito para servir de coração &middot; repertório salvo ao clicar em Salvar
  </footer>
</div>

<section id="catalogAdmin" class="catalog-admin" hidden aria-label="Administração do catálogo">
  <div class="catalog-admin__panel">
    <div class="catalog-admin__head"><h2>Editar catálogo de músicas</h2><button type="button" id="catalogAdminClose" aria-label="Fechar">✕</button></div>
    <p>Área administrativa. Edite nome, cantor e link; alterações são gravadas no catálogo.</p>
    <div class="catalog-admin__tools"><input id="catalogAdminSearch" type="search" placeholder="Buscar música ou cantor..." autocomplete="off"><button type="button" id="catalogAdminAdd">+ Adicionar música</button></div>
    <div id="catalogAdminList" class="catalog-admin__list"></div>
    <div id="catalogAdminStatus" role="status"></div>
  </div>
</section>

<template id="instrumentPillTemplate">
  <button type="button" class="pill">
    <span class="pill__icon"></span>
    <span class="pill__label"></span>
    <span class="pill__name"></span>
  </button>
</template>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(error => console.warn('PWA: não foi possível registrar o service worker', error));
    });
  }
</script>
<script>
(() => {
  const button = document.getElementById('installAppBtn');
  const help = document.getElementById('installAppHelp');
  let installPrompt = null;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isSafari = isIOS && /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const showHelp = (message) => { help.textContent = message; help.hidden = false; };

  if (isStandalone) {
    button.textContent = '✓ App instalado';
    button.disabled = true;
  }
  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    installPrompt = event;
    button.textContent = '⬇️ Baixe aqui o app';
  });
  window.addEventListener('appinstalled', () => {
    installPrompt = null;
    button.textContent = '✓ App instalado';
    button.disabled = true;
    showHelp('Pronto! O app foi instalado no seu celular.');
  });
  button.addEventListener('click', async () => {
    if (isStandalone) return;
    if (installPrompt) {
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      return;
    }
    if (isIOS) {
      showHelp(isSafari
        ? 'Para instalar: toque em Compartilhar (quadrado com seta para cima) e escolha “Adicionar à Tela de Início”. Depois toque em “Adicionar”.'
        : 'Para instalar no iPhone, abra este site no Safari. Depois toque em Compartilhar e escolha “Adicionar à Tela de Início”.');
      return;
    }
    showHelp('Se a opção de instalação não aparecer automaticamente, abra o menu ⋮ do Chrome e escolha “Instalar app” ou “Adicionar à tela inicial”.');
  });
})();
</script>
</body>
</html>
