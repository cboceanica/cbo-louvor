<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Escalas CBO">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Escala de Comunicação · CBO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#123b36;--green2:#1d6256;--cream:#f5efe3;--ink:#203b35;--muted:#65756e;--line:#dbe4dc}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#e6eee7,#f5efe3 60%,#eee5d5);font-family:Inter,system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:22px}
main{width:min(100%,900px);margin:auto}.top{display:flex;align-items:center;gap:14px;margin:8px 0 20px}.logo{width:62px;height:62px;object-fit:contain}.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--green2)}h1{margin:5px 0 0;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-.04em;color:var(--green)}.back{display:inline-block;color:var(--green2);font-size:.9rem;font-weight:700;text-decoration:none;margin:0 0 20px}.month{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fffdf9;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:16px}.month button,.save{border:0;border-radius:11px;background:var(--green);color:white;font:inherit;font-weight:700;padding:11px 14px;cursor:pointer}.month-label{text-align:center;font-weight:800;color:var(--green)}.status{font-size:.83rem;color:var(--muted);margin:0 0 14px;min-height:1.2em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.day{background:#fffdf9;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 7px 20px #173e300a}.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #e8eee8;padding-bottom:12px;margin-bottom:14px}.date{font-size:1.4rem;font-weight:800;color:var(--green)}.weekday{text-transform:capitalize;color:var(--muted);font-size:.85rem}.selectlabel{display:block;font-size:.82rem;font-weight:700;margin-bottom:8px}.person{width:100%;border:1px solid #cbd8ce;border-radius:10px;padding:12px;background:white;color:var(--ink);font:inherit}.save{width:100%;margin-top:12px}.saved{font-size:.8rem;color:var(--green2);min-height:1.2em;margin-top:9px}.empty{background:#fffdf9;border:1px dashed #cbd8ce;border-radius:18px;padding:28px;text-align:center;color:var(--muted);grid-column:1/-1}.foot{text-align:center;color:#75827c;font-size:.78rem;margin:24px 0 10px}
@media(max-width:580px){body{padding:15px}.grid{grid-template-columns:1fr}.month{padding:10px}.month button{padding:10px 12px}.logo{width:52px;height:52px}}
</style>
</head>
<body>
<main data-ministry="comunicacao">
<a class="back" href="./">← Todos os ministérios</a>
<header class="top"><img class="logo" src="./logo-igreja.png" alt="CBO"><div><div class="eyebrow">Comunidade Batista Oceânica</div><h1>📣 Escala de Comunicação</h1></div></header>
<div class="month"><button type="button" id="prev" aria-label="Mês anterior">←</button><div class="month-label" id="monthLabel">Carregando…</div><button type="button" id="next" aria-label="Próximo mês">→</button></div>
<p class="status" id="status" role="status">Conectando ao banco de dados…</p>
<section class="grid" id="calendar" aria-live="polite"></section>
<footer class="foot">CBO · As escalas ficam salvas e podem ser consultadas em meses anteriores.</footer>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js"></script>
<script src="./ministry-calendar.js"></script>
</body></html>
